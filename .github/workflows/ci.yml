name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. package.json's `packageManager`
      # (pnpm@10.0.0) is authoritative, and action-setup hard-errors when both
      # are given — which silently broke every CI run from 2026-06-25 onward.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Before `build` on purpose: the suite runs in under a second, so a broken
      # test reports in seconds rather than after a full Next build.
      - run: pnpm test
      - run: pnpm build

  lighthouse:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. package.json's `packageManager`
      # (pnpm@10.0.0) is authoritative, and action-setup hard-errors when both
      # are given — which silently broke every CI run from 2026-06-25 onward.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Performance + accessibility budgets (seo-discoverability / accessibility specs)
      - name: Lighthouse CI
        run: pnpm dlx @lhci/cli@0.14.x autorun
